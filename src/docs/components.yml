components:
  schemas:
    UserSummary:
      type: object
      description: Compact user shape used in lists and embedded references.
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, project_manager, developer, qa], nullable: true }
        status: { type: string, enum: [pending, active, suspended, rejected] }
        avatarUrl: { type: string, nullable: true }
      example:
        id: 5ebac534954b54139806c112
        name: Jane QA
        email: jane@example.com
        role: qa
        status: active
        avatarUrl: null

    UserDetail:
      description: A single user, /auth/me and login. Summary plus the permissions the user's role grants, and dates.
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            permissions: { type: array, items: { type: string } }
            lastLoginAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
      example:
        id: 5ebac534954b54139806c112
        name: Jane QA
        email: jane@example.com
        role: qa
        status: active
        avatarUrl: null
        permissions: [bug:create, bug:read, bug:verify]
        lastLoginAt: 2026-10-09T09:30:00.000Z
        createdAt: 2026-10-01T08:00:00.000Z

    Registration:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [pending] }

    UserPage:
      type: object
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        totalPages: { type: integer, example: 1 }
        totalResults: { type: integer, example: 1 }

    UserRef:
      type: object
      description: The smallest user reference (name + avatar).
      nullable: true
      properties:
        id: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }

    BugSummary:
      type: object
      description: |
        Computed per request from the project's (non-deleted) bugs. open = total minus pass.
        pie is the project card's chart: reported = reported, ongoing = ongoing + failed, resolved = resolved + pass.
      properties:
        total: { type: integer, example: 12 }
        open: { type: integer, example: 9 }
        byStatus:
          type: object
          properties:
            reported: { type: integer, example: 4 }
            ongoing: { type: integer, example: 3 }
            resolved: { type: integer, example: 1 }
            pass: { type: integer, example: 3 }
            failed: { type: integer, example: 1 }
        pie:
          type: object
          properties:
            reported: { type: integer, example: 4 }
            ongoing: { type: integer, example: 4 }
            resolved: { type: integer, example: 4 }

    ProjectListItem:
      type: object
      description: One card on the projects grid.
      properties:
        id: { type: string }
        name: { type: string, example: BugTrail }
        key: { type: string, example: BT }
        status: { type: string, enum: [active, completed, archived] }
        manager: { $ref: '#/components/schemas/UserRef' }
        memberCount: { type: integer, example: 5 }
        bugSummary: { $ref: '#/components/schemas/BugSummary' }
        updatedAt: { type: string, format: date-time }

    ProjectDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: BugTrail }
        key: { type: string, example: BT }
        description: { type: string }
        status: { type: string, enum: [active, completed, archived] }
        manager:
          allOf: [{ $ref: '#/components/schemas/UserSummary' }]
          nullable: true
        members: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        bugSummary: { $ref: '#/components/schemas/BugSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectPage:
      type: object
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/ProjectListItem' } }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        totalPages: { type: integer, example: 1 }
        totalResults: { type: integer, example: 1 }

    MemberList:
      type: object
      properties:
        members: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }

    ProjectRef:
      type: object
      properties:
        id: { type: string }
        key: { type: string, example: BT }
        name: { type: string, example: BugTrail }

    Attachment:
      type: object
      required: [title, url]
      properties:
        title: { type: string, example: Screen recording }
        url: { type: string, format: uri, example: 'https://drive.google.com/file/d/abc/view', description: Google Drive / Docs links only }

    BugListItem:
      type: object
      description: One row of the ticket grid.
      properties:
        id: { type: string }
        key: { type: string, example: BT-42 }
        project: { $ref: '#/components/schemas/ProjectRef' }
        title: { type: string }
        moduleName: { type: string, example: Login }
        status: { type: string, enum: [reported, ongoing, resolved, pass, failed] }
        assignee: { $ref: '#/components/schemas/UserRef' }
        reporter: { $ref: '#/components/schemas/UserRef' }
        failCount: { type: integer, example: 1 }
        ageMs: { type: integer, description: Created until passed (or now), in ms }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BugDetail:
      type: object
      properties:
        id: { type: string }
        key: { type: string, example: BT-42 }
        project: { $ref: '#/components/schemas/ProjectRef' }
        title: { type: string }
        moduleName: { type: string }
        description: { type: string }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        status: { type: string, enum: [reported, ongoing, resolved, pass, failed] }
        allowedStatuses:
          type: array
          items: { type: string }
          description: Statuses YOU may move this bug to now. Show only these in the UI.
          example: [ongoing]
        assignee:
          allOf: [{ $ref: '#/components/schemas/UserSummary' }]
          nullable: true
        reporter: { $ref: '#/components/schemas/UserSummary' }
        failCount: { type: integer }
        ageMs: { type: integer }
        timeInStatus:
          type: object
          description: Milliseconds spent in each status (pass excluded; passing stops the clock)
          properties:
            reported: { type: integer }
            ongoing: { type: integer }
            resolved: { type: integer }
            failed: { type: integer }
        lastStatusChangedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        passedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BugPage:
      type: object
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/BugListItem' } }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        totalPages: { type: integer, example: 1 }
        totalResults: { type: integer, example: 1 }

    ActivityList:
      type: object
      properties:
        activity:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string, enum: [created, updated, status_changed, assigned, deleted] }
              actor: { $ref: '#/components/schemas/UserRef' }
              from: { description: 'status_changed: a status. assigned: a UserRef or null.' }
              to: { description: 'created / status_changed: a status. assigned: a UserRef or null.' }
              fields: { type: array, items: { type: string }, description: 'updated: which fields changed' }
              createdAt: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: string }
        bugId: { type: string }
        sender: { $ref: '#/components/schemas/UserRef' }
        body: { type: string, nullable: true, description: null when deleted }
        mentions: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
        editedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
        createdAt: { type: string, format: date-time }

    MessagePage:
      type: object
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/Message' }, description: Oldest first }
        nextCursor: { type: string, nullable: true, description: 'Pass as ?before= to load older messages; null when there are none' }

    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [bug_assigned, bug_status_changed, bug_message, bug_mentioned, project_member_added, user_registered] }
        title: { type: string, example: BT-42 was assigned to you }
        message: { type: string }
        link: { type: string, nullable: true, example: /projects/5ebac534954b54139806c112/bugs/BT-42 }
        entity:
          type: object
          nullable: true
          properties:
            kind: { type: string, enum: [bug, project, user] }
            id: { type: string }
            projectId: { type: string }
            key: { type: string }
        actor: { $ref: '#/components/schemas/UserRef' }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    NotificationPage:
      type: object
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        totalPages: { type: integer, example: 1 }
        totalResults: { type: integer, example: 1 }

    AccessCatalog:
      type: object
      description: Served from code. Roles are a fixed enum; permissions follow from the role.
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: qa }
              label: { type: string, example: QA }
              description: { type: string }
              permissions: { type: array, items: { type: string } }
        permissionGroups:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: bug }
              label: { type: string, example: Bugs }
              permissions:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string, example: 'bug:verify' }
                    label: { type: string, example: Mark bugs Pass / Failed }

    Token:
      type: object
      properties:
        token: { type: string }
        expires: { type: string, format: date-time }
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
        expires: 2026-10-09T10:00:00.000Z

    Session:
      type: object
      description: Login response. The refresh token is NOT in the body; it is set as an httpOnly cookie.
      properties:
        user: { $ref: '#/components/schemas/UserDetail' }
        tokens:
          type: object
          properties:
            access: { $ref: '#/components/schemas/Token' }

    Error:
      type: object
      properties:
        code: { type: number }
        message: { type: string }

  responses:
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 400, message: Email already taken }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 401, message: Please authenticate }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 403, message: Forbidden }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 404, message: Not found }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
